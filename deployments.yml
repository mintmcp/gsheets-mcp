# profile names a frozen scope set from PROFILES in src/scopes.ts

- app: gsheets-mintmcp-staging
  env: staging
  live: true
  profile: standard # drive.readonly + drive.file + spreadsheets

- app: gsheets-mintmcp
  env: prod
  live: true
  profile: standard # drive.readonly + drive.file + spreadsheets

# Pair the labels app with the write-grant gate middleware and an approval rule on the
# Drive connector's set_file_label
- app: gsheets-mintmcp-labels
  env: prod
  live: true
  profile: labels # standard + drive.labels.readonly
